<!doctype html>

<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

    <div class="course-label">ACOMPANHAMENTO ACADÊMICO</div>
    <nav id="navigation">
      <a href="#overview" data-view="overview"><span data-icon="dashboard"></span>Visão geral</a>
